<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Data Loading</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    .info { background: #f0f0f0; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Data Loading Test</h1>
  <div id="results"></div>

  <script src="js/data.js"></script>
  <script>
    const resultsDiv = document.getElementById('results');
    let html = '';

    // Test 1: Check if products array exists
    if (typeof products !== 'undefined') {
      html += '<p class="success">✓ Products array loaded successfully</p>';
      html += `<p class="info">Total products: ${products.length}</p>`;
      
      // Show first 3 products
      html += '<h3>First 3 Products:</h3>';
      products.slice(0, 3).forEach(p => {
        html += `<div class="info">ID: ${p.id}, Name: ${p.name}, Price: ${p.price} ${p.currency}</div>`;
      });
    } else {
      html += '<p class="error">✗ Products array NOT loaded</p>';
    }

    // Test 2: Check if categories array exists
    if (typeof categories !== 'undefined') {
      html += '<p class="success">✓ Categories array loaded successfully</p>';
      html += `<p class="info">Total categories: ${categories.length}</p>`;
      
      // Show all categories
      html += '<h3>All Categories:</h3>';
      categories.forEach(c => {
        html += `<div class="info">ID: ${c.id}, Name: ${c.nameEnglish}</div>`;
      });
    } else {
      html += '<p class="error">✗ Categories array NOT loaded</p>';
    }

    // Test 3: Check products with variants
    if (typeof products !== 'undefined') {
      const withVariants = products.filter(p => p.hasVariants);
      html += '<h3>Products with Variants:</h3>';
      html += `<p class="info">Total products with variants: ${withVariants.length}</p>`;
      
      if (withVariants.length > 0) {
        html += '<div class="info">';
        withVariants.slice(0, 3).forEach(p => {
          html += `<p><strong>${p.name}</strong>: ${p.variants ? p.variants.length : 0} variants</p>`;
        });
        html += '</div>';
      }
    }

    resultsDiv.innerHTML = html;
  </script>
</body>
</html>
